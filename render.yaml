services:
  - type: web
    name: trafficeye-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./trafficeye.db
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIRECTORY
        value: uploads
      - key: EVIDENCE_DIRECTORY
        value: evidence
      - key: CONFIDENCE_THRESHOLD
        value: "0.45"
      - key: IOU_THRESHOLD
        value: "0.50"
      - key: DEVICE
        value: cpu
