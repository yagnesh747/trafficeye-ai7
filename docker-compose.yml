version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trafficeye_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./trafficeye.db
      - SECRET_KEY=trafficeye-docker-secret-key-2026
      - UPLOAD_DIRECTORY=uploads
      - EVIDENCE_DIRECTORY=evidence
    volumes:
      - ./uploads:/app/uploads
      - ./evidence:/app/evidence
      - ./models:/app/models
      - ./trafficeye.db:/app/trafficeye.db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: trafficeye_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
